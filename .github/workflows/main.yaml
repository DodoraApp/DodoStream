name: React Native CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: 'Build type to run'
        default: 'dev'
        options:
          - dev
          - prod-apk
          #- prod-aab
          #- ios-dev
          #- ios-prod
      platform:
        type: choice
        description: 'Platform to build'
        default: 'android'
        options:
          - android
          #- ios

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
  EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}
  EXPO_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
  GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  NODE_OPTIONS: --openssl-legacy-provider
  # Expose commit hash to the app (used by the About page)
  EXPO_PUBLIC_GIT_COMMIT_HASH: ${{ github.sha }}
  EXPO_PUBLIC_GITHUB_RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases

jobs:
  test:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🏗 Install pnpm
        uses: pnpm/action-setup@1e1c8eafbd745f64b1ef30a7d7ed7965034c486c
        with:
          cache: true
          run_install: false

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ✅ Run CI-equivalent verification
        run: pnpm verify:ci
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1

  build:
    needs: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android builds
          - name: 'Android Dev APK'
            platform: android
            profile: development
            output: app-dev.apk
            channel: development
            ext: apk
            node_env: development
            build_type: dev
            run_on_push: false
            runs_on: ubuntu-latest

          - name: 'Android Dev TV APK'
            platform: android
            profile: development_tv
            output: app-dev_tv.apk
            channel: development_tv
            ext: apk
            node_env: development
            build_type: dev
            run_on_push: false
            runs_on: ubuntu-latest

          - name: 'Android Production APK'
            platform: android
            profile: production_apk
            output: app-prod.apk
            channel: production
            ext: apk
            node_env: production
            build_type: prod-apk
            run_on_push: true
            runs_on: ubuntu-latest

          - name: 'Android Production TV APK'
            platform: android
            profile: production_tv_apk
            output: app-prod_tv.apk
            channel: production_tv
            ext: apk
            node_env: production
            build_type: prod-apk
            run_on_push: true
            runs_on: ubuntu-latest

          # # iOS builds
          # - name: 'iOS Dev'
          #   platform: ios
          #   profile: development
          #   output: app-ios-dev.app
          #   node_env: development
          #   build_type: ios-dev
          #   runs_on: macos-latest

          # - name: 'iOS Production'
          #   platform: ios
          #   profile: production
          #   output: app-ios-prod.ipa
          #   node_env: production
          #   build_type: ios-prod
          #   runs_on: macos-latest

    runs-on: ${{ matrix.runs_on }}
    name: Build ${{ matrix.name }}

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🏗 Install pnpm
        uses: pnpm/action-setup@1e1c8eafbd745f64b1ef30a7d7ed7965034c486c
        with:
          cache: true

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm i -g eas-cli@latest

      - name: 🔖 Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: 📁 Setup expo-build-disk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.expo-build-disk-cache
          key: ${{ runner.os }}-expo-build-disk-cache-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-expo-build-disk-cache-

      - name: Verify EAS CLI installation
        run: |
          echo "EAS CLI version:"
          eas --version

      - name: 🧠 Tune Gradle JVM for CI
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          # CI-only Gradle tuning (avoids :expo-updates:lintVitalAnalyzeRelease Metaspace OOM)
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.daemon.performance.disable-logging=true
          EOF

      - name: 📱 Build ${{ matrix.name }}
        id: eas_build
        if: |
          (github.event_name == 'push' && matrix.run_on_push) ||
          (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.buildType == matrix.build_type &&
            github.event.inputs.platform == matrix.platform
          )
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          echo "Building for ${{ matrix.channel }}"
          eas build --platform ${{ matrix.platform }} --profile ${{ matrix.profile }} --local --non-interactive --output ./output.tar.gz
        env:
          NODE_ENV: ${{ matrix.node_env }}

      - name: 📦 Prepare APK artifacts
        id: prepare_artifacts
        if: steps.eas_build.outcome == 'success' && matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p dist

          # Extract the output archive
          echo "Extracting output.tar.gz..."
          tar -xzf output.tar.gz

          # Determine build type (debug or release) based on NODE_ENV
          if [[ "$NODE_ENV" == "production" ]]; then
            BUILD_TYPE="release"
          else
            BUILD_TYPE="debug"
          fi

          echo "Looking for APKs in outputs/apk/${BUILD_TYPE}/"

          # Find all APKs in the extracted directory
          find outputs/apk/${BUILD_TYPE} -name "*.apk" -type f 2>/dev/null | while read -r apk; do
            filename=$(basename "$apk")
            echo "Found APK: $filename"
            
            # Extract ABI from filename (e.g., app-arm64-v8a-release.apk -> arm64-v8a)
            if [[ $filename =~ -([a-z0-9_-]+)-(release|debug)\.apk$ ]]; then
              abi="${BASH_REMATCH[1]}"
              # Rename to our format: DodoStream-<version>-<channel>-<abi>.apk
              new_name="DodoStream-${VERSION}-${CHANNEL}-${abi}.apk"
              cp "$apk" "dist/$new_name"
              echo "Copied to: dist/$new_name"
            elif [[ $filename =~ app-(release|debug)\.apk$ ]]; then
              # Universal APK without ABI suffix
              new_name="DodoStream-${VERSION}-${CHANNEL}-universal.apk"
              cp "$apk" "dist/$new_name"
              echo "Copied to: dist/$new_name"
            fi
          done

          # List all prepared artifacts
          echo "Prepared artifacts:"
          ls -lh dist/

          # Set output for upload step
          if [ -n "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "artifacts_exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "No artifacts found!"
            exit 1
          fi
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          CHANNEL: ${{ matrix.channel }}
          NODE_ENV: ${{ matrix.node_env }}

      - name: 📦 Upload build artifacts
        if: steps.prepare_artifacts.outputs.artifacts_exist == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DodoStream-${{ steps.app_version.outputs.version }}-${{ matrix.channel }}
          path: dist/*.apk
          retention-days: 7

  expo_update:
    needs: [test]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main' &&
      github.event.inputs.buildType == 'dev'
    runs-on: ubuntu-latest
    name: Expo Update

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🏗 Install pnpm
        uses: pnpm/action-setup@1e1c8eafbd745f64b1ef30a7d7ed7965034c486c
        with:
          cache: true

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm i -g eas-cli@latest

      - name: 🚀 Publish to Expo
        run: eas update --channel development --environment development
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  publish:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Publish
    permissions:
      contents: write

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 🏗 Install pnpm
        uses: pnpm/action-setup@1e1c8eafbd745f64b1ef30a7d7ed7965034c486c
        with:
          cache: true

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm i -g eas-cli@latest

      - name: 🔖 Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: 📥 Download production APK artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: DodoStream-*-production*
          path: dist
          merge-multiple: true

      - name: 📂 Extract and prepare artifacts
        id: prepare-artifacts
        shell: bash
        run: |
          echo "Final list of APK artifacts:"
          find dist/ -name "*.apk" -type f -exec ls -lh {} \;

          apk_count=$(find dist/ -name "*.apk" -type f 2>/dev/null | wc -l)
          echo "Total APKs ready for release: $apk_count"

          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: No APK files found!"
            exit 1
          fi

      - name: 🏷️ Create GitHub Release if not exists
        env:
          # Custom PAT token required so that the other on: release workflow is triggered
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" dist/*.apk \
            --title "$TAG" \
            --generate-notes \
            --prerelease
