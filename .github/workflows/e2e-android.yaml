name: Android E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            target: google_apis
            emulator: pixel_7_pro
            profile: phone
            flow: full-journey.yaml
          - name: tablet
            target: google_apis
            emulator: pixel_7_pro
            profile: tablet
            flow: full-journey.yaml
          - name: tv
            target: android-tv
            emulator: tv_1080p
            profile: tv
            flow: full-journey.yaml
          - name: tv-navigation
            target: android-tv
            emulator: tv_1080p
            profile: tv
            flow: tv-navigation.yaml

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@1e1c8eafbd745f64b1ef30a7d7ed7965034c486c # v4
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run E2E
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.emulator }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: pnpm e2e:android -- --profile ${{ matrix.profile }} --flow ${{ matrix.flow }}

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ matrix.name }}
          path: artifacts/maestro/${{ matrix.profile }}/
          if-no-files-found: ignore
          retention-days: 14
